version: '3.8'

services:
  # MySQL-Datenbank
  db:
    image: mysql:8.0
    container_name: buchverwaltung_db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: buchverwaltung
      MYSQL_USER: symfony
      MYSQL_PASSWORD: symfony
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Symfony-Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: buchverwaltung_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "mysql://symfony:symfony@db:3306/buchverwaltung?serverVersion=8.0"
    command: sh -c "composer install && php bin/console doctrine:migrations:migrate --no-interaction && symfony serve --no-tls --port=8000"

  # Angular-Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: buchverwaltung_frontend
    ports:
      - "4200:80"
    volumes:
      - ./frontend:/app
    command: sh -c "npm install && ng serve --host 0.0.0.0 --port 80"

# Volumes für persistente Daten
volumes:
  db_data:
